{% extends "base.html" %}
{% from "_macros.html" import errors as show_errors %}
{% block title %}Register · To-Do{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>Create your account</h1>
  <p class="lead">One minute, then your list is ready.</p>
  <form method="post" action="{{ url_for('register') }}" data-validate="register" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {{ show_errors(errors) }}
    <label for="name">Name</label>
    <input id="name" type="text" name="name" value="{{ form.get('name', '') }}" autocomplete="name">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="new-password">
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password">
    <button class="btn btn-primary btn-block" type="submit">Register</button>
  </form>
  <p class="alt">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
