{% extends "base.html" %}
{% from "_macros.html" import errors as show_errors %}
{% block title %}Log in · To-Do{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>Log in</h1>
  <p class="lead">Welcome back. Log in to see your to-dos.</p>
  <form method="post" action="{{ url_for('login') }}" data-validate="login" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {{ show_errors(errors) }}
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password">
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
