<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}To-Do{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">To-Do</a>
    {% if session.get('user_id') %}
    <nav class="nav">
      <a href="{{ url_for('todos') }}">To-Dos</a>
      <a href="{{ url_for('library') }}">Library</a>
    </nav>
    <div class="who">
      <span class="hello">Hi, {{ session['user_name'] }}</span>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-ghost" type="submit">Log out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="page{% block page_class %}{% endblock %}">
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="toast" role="status">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
